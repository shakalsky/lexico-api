services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: lexico
      POSTGRES_PASSWORD: lexico
      POSTGRES_DB: lexico
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lexico -d lexico"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  pgdata:
